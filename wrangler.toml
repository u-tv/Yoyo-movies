# YOOYOO MOVIE - Cloudflare Workers Configuration
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "yooyoomovie-api"
main = "worker.js"
compatibility_date = "2024-08-13"
compatibility_flags = ["nodejs_compat"]

# Minify JavaScript for production
minify = true

# Workers Logs (observability)
[observability]
enabled = true
head_sampling_rate = 1

# Route configuration (optional - add your custom domain)
# routes = [
#   { pattern = "api.yooyoomovie.com", custom_domain = true }
# ]

# KV Namespace for caching movie data & search results
[[kv_namespaces]]
binding = "MOVIE_CACHE"
id = "your_kv_namespace_id_here"

# Staging Environment
[env.staging]
name = "yooyoomovie-api-staging"
minify = false

[env.staging.vars]
ENVIRONMENT = "staging"
TMDB_BASE_URL = "https://api.themoviedb.org/3"
CACHE_TTL = "1800"

[env.staging.kv_namespaces]
binding = "MOVIE_CACHE"
id = "your_staging_kv_id_here"

# Production Environment
[env.production]
name = "yooyoomovie-api-prod"
minify = true

[env.production.vars]
ENVIRONMENT = "production"
TMDB_BASE_URL = "https://api.themoviedb.org/3"
CACHE_TTL = "3600"

[env.production.kv_namespaces]
binding = "MOVIE_CACHE"
id = "your_production_kv_id_here"

# Secrets (DO NOT put sensitive values here - use wrangler secret put)
# wrangler secret put TMDB_API_KEY
# wrangler secret put ADSTERRA_KEY_1 --env production
# wrangler secret put ADSTERRA_KEY_2 --env production

# Analytics Engine (optional - for tracking API usage)
# [[analytics_engine_datasets]]
# binding = "API_ANALYTICS"
# dataset = "yooyoomovie_api"

# R2 Bucket (optional - for storing movie posters locally)
# [[r2_buckets]]
# binding = "POSTER_BUCKET"
# bucket_name = "yooyoomovie-posters"
